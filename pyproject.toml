[project]
name = "devexana-netlab"
version = "0.1.0"
description = "Randomized network testing lab for evaluating Devexana against hidden ground truth"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "asyncssh>=2.17",
  "cryptography>=43",
]

[project.scripts]
netlab = "netlab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netlab"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311", "SIM105", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
